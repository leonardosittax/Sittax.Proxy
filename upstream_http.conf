###########################################################################
# Sonda de validação VPN / Split-DNS — servida pelo PRÓPRIO .32 (NÃO vai p/ .116)
# Acesse http://test-vpn.stage.sittax.com.br  (resolve p/ .32 via dnsmasq).
# Se a página abrir => VPN + DNS interno OK. Se não abrir => VPN/DNS com problema.
###########################################################################
upstream vpncheck {
    server 127.0.0.1:8081;
}
# Página do validador (servida no :80 p/ test-vpn.stage via map abaixo)
server {
    listen 127.0.0.1:8081;
    root /var/www/html/vpncheck;
    location / {
        try_files /index.html =404;
    }
}

# === Geo: origem INTERNA (VPN/LAN/local) vs PÚBLICA — só p/ os endpoints de validação ===
geo $vpn_or_local {
    default        0;
    127.0.0.1/32   1;
    10.0.0.0/8     1;     # pool VPN (10.8.0.0/24) e afins
    172.16.0.0/12  1;     # docker / internas
    192.168.0.0/16 1;     # LAN (e VPN mascarada como 192.168.2.138)
}

# === Endpoints FAKE de validação: test-vpn.<env>.sittax.com.br:8089 ===
# Listener DIRETO (vê o IP de origem real) numa porta NÃO publicada na WAN.
# Geo-gate: 200 se interno (VPN/local), 403 se público — preview do bloqueio futuro.
# NÃO serve conteúdo e NÃO toca em :80/:443 (estrutura real intacta).
server {
    listen 8089;
    listen [::]:8089;
    server_name ~^test-vpn\.;

    location / {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        if ($vpn_or_local = 0) { return 403 "public-blocked\n"; }
        return 200 "vpn-ok\n";
    }
}

map $host $backend_name_http {
    # Formato: dominio.com backend_name;
    
    sentry.sittax.com.br      sentry_http;
    otlp.sittax.com.br        otlp;
