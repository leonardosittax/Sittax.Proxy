###########################################################################
# UPSTREAMS HTTP (Porta 80)
###########################################################################

upstream allDefault_http {
    server 192.168.2.116:80;
    server 192.168.2.115:80 backup;  # Fallback: worker build-sittax (ingress mesh do swarm)
    server 192.168.2.114:80 backup;  # Fallback: worker jenkins (ingress mesh do swarm)
    server 192.168.2.117:80 backup;  # Fallback: worker tests-sittax (ingress mesh do swarm)
    server 192.168.1.116:80 backup;  # Fallback: servidor antigo
}

upstream bySittax {
    server 192.168.1.22:80;
}

upstream registry {
    server 192.168.2.100:80;
}
###########################################################################
# AMBIENTES DE HOMOLOGAÇÃO — um upstream dedicado por env (porta 80)
# IMPORTANTE: manter o MESMO destino do upstream_https.conf — o desafio
# ACME (Let's Encrypt) chega pela 80 e precisa cair na máquina dona.
###########################################################################
upstream env_dev {
    server 192.168.2.116:80;
    # server 192.168.2.115:80;   # build-sittax
}
upstream env_qa01 {
    server 192.168.2.116:80;
    # server 192.168.2.114:80;   # jenkins
}
upstream env_qa02 {
    server 192.168.2.116:80;
    # server 192.168.2.114:80;   # jenkins
}
upstream env_qa03 {
    server 192.168.2.116:80;
    # server 192.168.2.115:80;   # build-sittax
}
upstream env_stage {
    server 192.168.2.116:80;
    # server 192.168.2.117:80;   # tests-sittax
}

###########################################################################
# Sonda de validação VPN / Split-DNS — servida pelo PRÓPRIO .32 (NÃO vai p/ .116)
# Acesse http://test-vpn.stage.sittax.com.br  (resolve p/ .32 via dnsmasq).
# Se a página abrir => VPN + DNS interno OK. Se não abrir => VPN/DNS com problema.
###########################################################################
upstream vpncheck {
    server 127.0.0.1:8081;
}
# Página do validador (servida no :80 p/ test-vpn.stage via map abaixo)
server {
    listen 127.0.0.1:8081;
    root /var/www/html/vpncheck;
    location / {
        try_files /index.html =404;
    }
}

# === Geo: origem INTERNA (VPN/LAN/local) vs PÚBLICA — só p/ os endpoints de validação ===
geo $vpn_or_local {
    default        0;
    127.0.0.1/32   1;
    10.0.0.0/8     1;     # pool VPN antiga (10.8.0.0/24) e afins
    100.81.0.0/16  1;     # VPN NetBird (wt0)
    172.16.0.0/12  1;     # docker / internas
    192.168.0.0/16 1;     # LAN (e VPN mascarada como 192.168.2.138)
}

# === Endpoints FAKE de validação: test-vpn.<env>.sittax.com.br:8089 ===
# Listener DIRETO (vê o IP de origem real) numa porta NÃO publicada na WAN.
# Geo-gate: 200 se interno (VPN/local), 403 se público — preview do bloqueio futuro.
# NÃO serve conteúdo e NÃO toca em :80/:443 (estrutura real intacta).
server {
    listen 8089;
    listen [::]:8089;
    server_name ~^test-vpn\.;

    location / {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        if ($vpn_or_local = 0) { return 403 "public-blocked\n"; }
        return 200 "vpn-ok\n";
    }
}

map $host $backend_name_http {
    # Formato: dominio.com backend_name;
    registry.sittax.com.br    registry;

    # ── Ambientes de homologação (upstream dedicado por env) ────────
    # Entradas exatas acima (ex.: test-vpn.stage → vpncheck) têm
    # precedência sobre estes regex.
    dev.sittax.com.br               env_dev;
    ~\.dev\.sittax\.com\.br$        env_dev;
    qa01.sittax.com.br              env_qa01;
    ~\.qa01\.sittax\.com\.br$       env_qa01;
    qa02.sittax.com.br              env_qa02;
    ~\.qa02\.sittax\.com\.br$       env_qa02;
    qa03.sittax.com.br              env_qa03;
    ~\.qa03\.sittax\.com\.br$       env_qa03;
    stage.sittax.com.br             env_stage;
    ~\.stage\.sittax\.com\.br$      env_stage;
    # Domínios legados de homolog (homologacao, apihomologacao, ...) → stage
    ~homologacao\.sittax\.com\.br$  env_stage;
    bysittax.sittax.com.br               bySittax;
    ~\.bysittax\.sittax\.com\.br$        bySittax;
    # Sonda de validação VPN/split-DNS (servida pelo próprio .32, NÃO vai p/ .116)
    test-vpn.stage.sittax.com.br  vpncheck;

    # Default
    default                   allDefault_http;
}
