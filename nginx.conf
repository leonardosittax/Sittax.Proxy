# Configuração no /etc/nginx/nginx.conf
# Bloco stream { } fica FORA do bloco http { }

user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    ##
    # Basic Settings
    ##

    include /etc/nginx/upstream_http.conf;
    
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    # server_tokens off;

    # server_names_hash_bucket_size 64;
    # server_name_in_redirect off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # SSL Settings
    ##

    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
    ssl_prefer_server_ciphers on;

    ##
    # Logging Settings
    ##

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    ##
    # Log estruturado JSON enviado via syslog para o Vector (192.168.2.50:5140).
    # Alimenta a tabela ClickHouse netmon.nginx_access e os dashboards Grafana.
    ##
    log_format http_json escape=json '{'
        '"ts":"$time_iso8601",'
        '"src":"http",'
        '"host":"$host",'
        '"client":"$remote_addr",'
        '"cf_ip":"$http_cf_connecting_ip",'
        '"xff":"$http_x_forwarded_for",'
        '"backend":"$backend_name_http",'
        '"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"size":$body_bytes_sent,'
        '"req_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"referer":"$http_referer",'
        '"ua":"$http_user_agent",'
        '"ssl_proto":"$ssl_protocol",'
        '"scheme":"$scheme",'
        '"req_len":$request_length'
    '}';

    ##
    # Gzip Settings
    ##

    gzip on;

    # gzip_vary on;
    # gzip_proxied any;
    # gzip_comp_level 6;
    # gzip_buffers 16 8k;
    # gzip_http_version 1.1;
    # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    ##
    # Virtual Host Configs
    ##

    include /etc/nginx/conf.d/*.conf;
    # include /etc/nginx/sites-enabled/*;
    log_format http_detailed '[$time_local] '
                             'Host: $host | '
                             'Client: $remote_addr | '
                             'CF-IP: $http_cf_connecting_ip | '
                             'X-Forwarded-For: $http_x_forwarded_for | '
                             'Backend: $backend_name_http | '
                             'Method: $request_method | '
                             'URI: $request_uri | '
                             'Status: $status | '
                             'Size: $body_bytes_sent bytes | '
                             'Referer: "$http_referer" | '
                             'User-Agent: "$http_user_agent" | '
                             'Request-Time: ${request_time}s | '
                             'Upstream: $upstream_addr | '
                             'Upstream-Time: ${upstream_response_time}s';
    server {
        listen 127.0.0.1:8080;

        access_log /var/log/nginx/http_router.access.log http_detailed;
        access_log syslog:server=192.168.2.50:5140,tag=nginx_http,severity=info http_json;
        error_log /var/log/nginx/http_router.error.log;
	location / {
            proxy_pass http://$backend_name_http;

            # Headers essenciais
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;  # Cloudflare usa HTTPS
            proxy_set_header X-Forwarded-Host $host;

            # Headers do Cloudflare
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header CF-Ray $http_cf_ray;

            # Timeouts
            proxy_connect_timeout 600;
            proxy_send_timeout 600;
            proxy_read_timeout 600;
            send_timeout 600;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
	}

    }
}
stream {
    ###########################################################################
    # Formato de logs para stream (TCP/UDP - sem variáveis HTTP)
    ###########################################################################

    include /etc/nginx/upstream_https.conf;
    log_format stream_proxy '[$time_local] '
                            'Protocol: $protocol | '
                            'Client: $remote_addr:$remote_port | '
                            'Backend: $server_addr:$server_port | '
                            'Upstream: $upstream_addr | '
                            'Bytes Sent: $bytes_sent | '
                            'Bytes Received: $bytes_received | '
                            'Session Time: $session_time s | '
                            'DNS: $ssl_preread_server_name | '
                            'Status: $status';

    log_format stream_json escape=json '{'
        '"ts":"$time_iso8601",'
        '"src":"stream",'
        '"protocol":"$protocol",'
        '"client":"$remote_addr",'
        '"client_port":$remote_port,'
        '"backend_addr":"$server_addr",'
        '"backend_port":$server_port,'
        '"upstream":"$upstream_addr",'
        '"sni":"$ssl_preread_server_name",'
        '"bytes_sent":$bytes_sent,'
        '"bytes_recv":$bytes_received,'
        '"session_time":$session_time,'
        '"status":$status'
    '}';

    # Servidor HTTPS com TLS passthrough
    server {
        listen 443;
        listen [::]:443;

        access_log /var/log/nginx/stream_https.access.log stream_proxy;
        access_log syslog:server=192.168.2.50:5140,tag=nginx_stream,severity=info stream_json;
        error_log /var/log/nginx/stream_https.error.log;

        proxy_pass $backend_name_https;
        ssl_preread on;
    }

    ###########################################################################
    # Porta 80 — TCP proxy com roteamento híbrido
    ###########################################################################

    include /etc/nginx/upstream_stream_80.conf;

    server {
        listen 80;
        listen [::]:80;

        access_log /var/log/nginx/stream_http.access.log stream_proxy;
        access_log syslog:server=192.168.2.50:5140,tag=nginx_stream,severity=info stream_json;
        error_log /var/log/nginx/stream_http.error.log;

        proxy_pass $backend_name_80;
        ssl_preread on;
    }
}

