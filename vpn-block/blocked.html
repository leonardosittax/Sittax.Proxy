<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acesso restrito</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", Roboto, sans-serif;
         background:#0e1116; color:#e6edf3; line-height:1.6;
         display:flex; align-items:center; justify-content:center;
         min-height:100vh; padding:24px; }
  .card { max-width:460px; width:100%; background:#161b22; border:1px solid #30363d;
          border-radius:14px; padding:36px; text-align:center; }
  .icon { font-size:2rem; line-height:1; }
  h1 { font-size:1.3rem; margin:16px 0 10px; font-weight:600; }
  p { color:#8b949e; margin:0; font-size:.96rem; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🔒</div>
    <h1>Acesso restrito</h1>
    <p>Este recurso está disponível apenas a partir de uma rede autorizada.</p>
  </div>
</body>
</html>
