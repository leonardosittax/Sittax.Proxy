###########################################################################
# UPSTREAMS HTTPS (Porta 443)
###########################################################################

upstream deny_backend {
    server 127.0.0.1:9;
}

# Destino de quem NÃO está na VPN: em vez de derrubar a conexão (deny_backend,
# que só produz "connection reset" no browser), manda para o listener local que
# termina TLS e devolve a página explicando que o ambiente exige VPN.
upstream blocked_page {
    server 127.0.0.1:8443;
}

upstream allDefault {
    server 192.168.2.116:443;
    server 192.168.2.115:443 backup;  # Fallback: worker build-sittax (ingress mesh do swarm)
    server 192.168.2.114:443 backup;  # Fallback: worker jenkins (ingress mesh do swarm)
    server 192.168.2.117:443 backup;  # Fallback: worker tests-sittax (ingress mesh do swarm)
    server 192.168.1.116:443 backup;  # Fallback: servidor antigo
}

upstream bySittax {
    server 192.168.1.22:443;
}

upstream registry {
    server 192.168.2.100:443;
}

###########################################################################
# OBSERVABILIDADE (stage) — STACK FORA DO AR
#
# A rota fica declarada de proposito: os ~50 servicos .NET continuam
# apontando OTEL_* para otel.stage.sittax.com.br, e quando a stack voltar
# basta corrigir o IP aqui para tudo religar sem tocar em servico nenhum.
#
# O 192.168.2.149 abaixo e o endereco ANTIGO e nao existe mais (ARP FAILED
# em 06/08/2026) — a stack mudou de maquina e o proxy ficou para tras.
# CONFIRMAR O ENDERECO NOVO antes de considerar isto funcional.
###########################################################################
upstream observability {
    server 192.168.2.149:443;
}
###########################################################################
# AMBIENTES DE HOMOLOGAÇÃO — um upstream dedicado por env
#
# Hoje todos atendidos pelo traefik central no .116. Para mover/balancear
# um env, troque o IP pela máquina dona (e ajuste também no upstream_http
# .conf — o desafio ACME da porta 80 precisa seguir o mesmo destino):
#   192.168.2.115 build-sittax | 192.168.2.114 jenkins | 192.168.2.117 tests-sittax
###########################################################################
upstream env_dev {
    server 192.168.2.116:443;
    # server 192.168.2.115:443;   # build-sittax
}
upstream env_qa01 {
    server 192.168.2.116:443;
    # server 192.168.2.114:443;   # jenkins
}
upstream env_qa02 {
    server 192.168.2.116:443;
    # server 192.168.2.114:443;   # jenkins
}
upstream env_qa03 {
    server 192.168.2.116:443;
    # server 192.168.2.115:443;   # build-sittax
}
upstream env_stage {
    server 192.168.2.116:443;
    # server 192.168.2.117:443;   # tests-sittax
}
# Mapeamento HTTPS (443) - baseado em SNI
map $ssl_preread_server_name $lk_backend_name_https {
    # Formato: dominio.com backend_name;

    registry.sittax.com.br    registry;

    # Observabilidade de stage — stack fora do ar, rota mantida pronta.
    # Entradas exatas: tem precedencia sobre o regex ~\.stage\. abaixo.
    otel.stage.sittax.com.br        observability;
    grafana.stage.sittax.com.br     observability;
    prometheus.stage.sittax.com.br  observability;
    metrics.stage.sittax.com.br     observability;
    pyroscope.stage.sittax.com.br   observability;

    # ── Ambientes de homologação (upstream dedicado por env) ────────
    # Entradas exatas declaradas acima têm precedência sobre estes regex.
    dev.sittax.com.br               env_dev;
    ~\.dev\.sittax\.com\.br$        env_dev;
    qa01.sittax.com.br              env_qa01;
    ~\.qa01\.sittax\.com\.br$       env_qa01;
    qa02.sittax.com.br              env_qa02;
    ~\.qa02\.sittax\.com\.br$       env_qa02;
    qa03.sittax.com.br              env_qa03;
    ~\.qa03\.sittax\.com\.br$       env_qa03;
    stage.sittax.com.br             env_stage;
    ~\.stage\.sittax\.com\.br$      env_stage;
    # Domínios legados de homolog (homologacao, apihomologacao, ...) → stage
    ~homologacao\.sittax\.com\.br$  env_stage;
    bysittax.sittax.com.br               bySittax;
    ~\.bysittax\.sittax\.com\.br$        bySittax;
    # Default
    default                   allDefault;
}

###########################################################################
# GATE GLOBAL DE ACESSO — proxy INTERNO-ONLY (porta 443)
#
# Tudo que NÃO vier de IP interno (LAN/VPN/Docker) ou do IP público do
# escritório (177.223.44.35) é BLOQUEADO, para QUALQUER SNI — salvo as
# exceções declaradas em $is_public_sni.
#
# Quem é bloqueado NÃO leva connection reset: vai para o blocked_page, que
# termina TLS com o certificado do proprio hostname (espelhado do Traefik
# por sync-traefik-certs.sh) e devolve 403 com a pagina de acesso restrito.
#
# Acesso interno chega por split-DNS: a LAN via MikroTik -> dnsmasq deste
# proxy, e a VPN via nameserver group do NetBird + rota 192.168.2.32/32.
#
# Obs.: a porta 80 (ACME / Let's Encrypt) NÃO é afetada por este gate — a
# renovação do Traefik no .116 depende disso.
###########################################################################

# 1 = permitido, 0 = bloqueado. default 0 => nega por padrão.
geo $allowed_ip {
    # DESLIGADO em 06/08/2026 a pedido: liberado para todos enquanto o
    # split-DNS nao esta confiavel em todas as maquinas (Windows 10 nao
    # aplica o NRPT do NetBird). Para religar o bloqueio: default 0.
    default            1;          # 0 = default-deny (bloqueia tudo)

    177.223.44.35/32   1;          # IP público do escritório (WAN / hairpin)
    127.0.0.1/32       1;          # localhost
    10.0.0.0/8         1;          # VPN antiga (pool 10.8.0.0/24) + internos 10.x
    100.81.0.0/16      1;          # VPN NetBird (wt0) — o proxy vê o IP do túnel,
                                   # sem mascaramento: medido em 06/08/2026, um peer
                                   # remoto chega como 100.81.71.130.
    172.16.0.0/12      1;          # Docker (172.x privado)
    192.168.0.0/16     1;          # LAN (sub-rede antiga .1.x + nova .2.x)
}

# === Exceções ao gate: SNIs que continuam PÚBLICOS (acessíveis de qualquer IP) ===
#
# Tudo aqui fica exposto à internet, então cada entrada precisa de motivo: são
# serviços que recebem chamada de origem que NUNCA vai estar na VPN.
map $ssl_preread_server_name $is_public_sni {
    default                        0;
    registry.sittax.com.br         1;  # pull/push de CI e servidores externos
    n8nmarketing.sittax.com.br     1;  # recebe webhook de ferramentas de marketing
}

# Gate: bloqueia só quando NÃO é SNI público E o IP está fora da allowlist.
map "$is_public_sni:$allowed_ip" $backend_name_https {
    "0:0"      blocked_page;             # nem público nem IP interno -> página de aviso
    default    $lk_backend_name_https;   # público OU IP interno -> roteia normal
}
