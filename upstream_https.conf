    grafana.sittax.com.br     observability;
    prometheus.sittax.com.br  observability;
    otel.sittax.com.br        observability;
    metrics.sittax.com.br     observability;
    pyroscope.sittax.com.br   observability;
    # Stack de Observabilidade STAGE (192.168.2.149 — domínios *.stage.sittax.com.br)
    grafana.stage.sittax.com.br     observability;
    prometheus.stage.sittax.com.br  observability;
    otel.stage.sittax.com.br        observability;
    metrics.stage.sittax.com.br     observability;
    pyroscope.stage.sittax.com.br   observability;
    # Stack antiga (192.168.2.104) — acessível em grafana2/prometheus2
    grafana2.sittax.com.br    grafana;
    prometheus2.sittax.com.br prometheus;
    #clawd.sittax.com.br	      clawd;

    supabase.sittax.com.br    supabase;
    supabase.sittax.com       supabase;
    coolify.sittax.com.br     coolify;
    coolify.sittax.com        coolify;
    proxy.sittax.com.br       proxy;
    registry.sittax.com.br    registry;
    #sittax.bytoken.com.br     bytoken;
    hom.bytoken.com.br        bytoken;    
    #homologacao.bytoken.com.br     bytoken2;

    sittax.com.br             monitor;
    sittax.com                monitor;

    # Wildcards (se necessário no futuro)
    # *.sentry.sittax.com.br  sentry;
    bySittax.sittax.com.br               bySittax;
    ~\.bySittax\.sittax\.com\.br$        bySittax;
    appwrite.sittax.com.br    coolifydef;
    # Default
    default                   allDefault;
}

###########################################################################
# GATE GLOBAL DE ACESSO — proxy INTERNO-ONLY (porta 443)
#
# Tudo que NÃO vier de IP interno (LAN/VPN/Docker) ou do IP público do
# escritório (177.223.44.35) é BLOQUEADO, para QUALQUER SNI.
# Acesso interno chega via split-DNS (MikroTik) apontando os hostnames
# -> 192.168.2.32 (este proxy), que continua roteando normalmente.
#
# Obs.: a antiga allowlist de IPs Oracle/DevOps foi DESCONTINUADA.
# Obs.: a porta 80 (ACME / Let's Encrypt) NÃO é afetada por este gate.
###########################################################################

# 1 = permitido, 0 = bloqueado. default 0 => nega por padrão.
geo $allowed_ip {
    default            1;          # default-deny: bloqueia tudo

    177.223.44.35/32   1;          # IP público do escritório (WAN / hairpin)
    127.0.0.1/32       1;          # localhost
    10.0.0.0/8         1;          # VPN (pool 10.8.0.0/24) + internos 10.x
    172.16.0.0/12      1;          # Docker (172.x privado)
    192.168.0.0/16     1;          # LAN (sub-rede antiga .1.x + nova .2.x)
}

# === Exceções ao gate: SNIs que continuam PÚBLICOS (acessíveis de qualquer IP) ===
# registry precisa de pull/push de CI e servidores externos.
map $ssl_preread_server_name $is_public_sni {
    default                   0;
    registry.sittax.com.br    1;
}

# Gate: bloqueia só quando NÃO é SNI público E o IP está fora da allowlist.
map "$is_public_sni:$allowed_ip" $backend_name_https {
    "0:0"      deny_backend;             # nem público nem IP interno -> bloqueia
    default    $lk_backend_name_https;   # público OU IP interno -> roteia normal
}
